appId: com.stickernote.app
productName: StickerNote
directories:
  buildResources: resources
  output: release
files:
  - out/**/*
  - "!out/renderer/**/*"
extraResources:
  - from: out/renderer
    to: renderer
  - from: resources/icon.ico
    to: icon.ico
win:
  icon: resources/icon.ico
  target:
    - target: nsis
      arch: x64
  artifactName: "电脑便签-Setup-${version}.${ext}"
  forceCodeSigning: false
  # 跳过签名与 exe 图标/版本信息改写（该步骤依赖 winCodeSign，在无符号链接权限的
  # Windows 账号下会解压失败）。安装包与程序功能不受影响。
  signAndEditExecutable: false
nsis:
  oneClick: false
  allowToChangeInstallationDirectory: false
  installerIcon: resources/icon.ico
  uninstallerIcon: resources/icon.ico
  shortcutName: 电脑便签
  createDesktopShortcut: true
  createStartMenuShortcut: true
  menuCategory: 电脑便签
