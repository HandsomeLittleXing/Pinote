appId: com.stickernote.app
productName: Pinote
directories:
  buildResources: resources
  output: release
afterPack: scripts/wait-for-icon-edit.cjs
files:
  - out/**/*
  - "!out/renderer/**/*"
extraResources:
  - from: out/renderer
    to: renderer
  - from: resources/fonts
    to: font-licenses
    filter:
      - "*.txt"
      - "*.TXT"
  - from: resources/icon.ico
    to: icon.ico
win:
  icon: resources/icon.ico
  target:
    - target: nsis
      arch: x64
  artifactName: "贴记-Setup-${version}.${ext}"
  forceCodeSigning: false
  signAndEditExecutable: true
nsis:
  oneClick: false
  allowToChangeInstallationDirectory: false
  installerIcon: resources/icon.ico
  uninstallerIcon: resources/icon.ico
  shortcutName: 贴记
  createDesktopShortcut: true
  createStartMenuShortcut: true
  menuCategory: 贴记
